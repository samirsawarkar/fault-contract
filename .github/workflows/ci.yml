name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # faultgate-zero 0.2 (check plugins, formats.load) until it is on PyPI
      - name: Checkout faultgate-zero
        uses: actions/checkout@v4
        with:
          repository: Faultline-lab/faultgate-zero
          ref: feat/check-plugins-formats
          path: _deps/faultgate-zero
      # faultgate-zero's dev extra too: evals/run.py runs its own suite with fault-contract installed
      - run: python -m pip install -e "_deps/faultgate-zero[formats,dev]" -e ".[dev]"
      - run: python -m pytest -q
      - run: python evals/run.py --faultgate-zero _deps/faultgate-zero
      # build, twine and the actions above: OK in scout-a8ccd56b.md (copied from faultgate-zero)
      - run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
